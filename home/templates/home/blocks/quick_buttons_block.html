{% load wagtailcore_tags home_tags %}
{% unique_id as block_id %}

{% if self.style.custom_css %}
<style>
    #block-{{ block_id }} {
        {{ self.style.custom_css|safe }}
    }
</style>
{% endif %}

<style>
    #block-{{ block_id }} .quick-button-link {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 180px;
        padding: 12px 24px;
        background: #f39c12;
        border: 1px solid #d38307;
        border-radius: 6px;
        color: #000000;
        font-weight: 700;
        font-size: 1.05rem;
        box-shadow: 0 3px 6px rgba(0, 0, 0, 0.08);
        text-decoration: none;
        transition: all 0.2s ease-in-out;
        text-align: center;
    }
    #block-{{ block_id }} .quick-button-link:hover {
        background: #002b66;
        border-color: #002b66;
        color: #ffffff;
        transform: translateY(-2px);
        box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
        text-decoration: underline;
    }
    @media (max-width: 575.98px) {
        #block-{{ block_id }} .quick-button-link {
            width: 100% !important;
            min-width: 100% !important;
            padding: 10px 16px !important;
            font-size: 0.95rem !important;
        }
    }
</style>

<div id="block-{{ block_id }}" class="quick-buttons-section {{ self.style.custom_class }} {{ self.style.margin_top }} {{ self.style.margin_bottom }} {{ self.style.padding_top }} {{ self.style.padding_bottom }}">
    <div class="container py-3">
        {% if self.title %}
            <h3 class="h2 fw-bold text-dark border-bottom pb-2 mb-4 text-center">{{ self.title }}</h3>
        {% endif %}
        
        <div class="d-flex flex-wrap justify-content-center gap-3 gap-md-4 py-2">
            {% for item in self.buttons %}
                {% if item.link_page %}
                    <a href="{% pageurl item.link_page %}" class="quick-button-link">
                {% elif item.link_url %}
                    <a href="{{ item.link_url }}" class="quick-button-link" target="_blank" rel="noopener noreferrer">
                {% else %}
                    <a href="#" class="quick-button-link">
                {% endif %}
                    {{ item.text }}
                </a>
            {% endfor %}
        </div>
    </div>
</div>
